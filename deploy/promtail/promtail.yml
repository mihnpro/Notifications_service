server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      # Use Docker container name as the "service" label.
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: service

      # Preserve compose project and service labels for filtering in Grafana.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service

      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project

      # Map log stream (stdout/stderr).
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

    pipeline_stages:
      # Try to parse JSON logs (Go slog / Python structlog / Rust tracing).
      - json:
          expressions:
            level: level
            msg: msg
            ts: ts
            time: time
            logger: logger
      # Normalise timestamp — slog uses "time", structlog uses "ts".
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.999999999Z07:00"
      # Promote "level" to a Loki label for fast filtering.
      - labels:
          level:
