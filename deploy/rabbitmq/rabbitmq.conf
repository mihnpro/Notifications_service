# Load definitions on startup
management.load_definitions = /etc/rabbitmq/definitions.json

# Persistence
queue_master_locator = min-masters

# Memory threshold before flow control kicks in
vm_memory_high_watermark.relative = 0.7

# Disk free limit
disk_free_limit.relative = 1.5

# Heartbeat interval (seconds)
heartbeat = 60

# Max channels per connection
channel_max = 2047

# Consumer ack timeout (milliseconds) — must exceed provider stub max (300s) + margin
consumer_timeout = 400000
