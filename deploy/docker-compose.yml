services:
  postgres:
    image: postgres:16-alpine
    container_name: notifications_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-notifications} -d ${POSTGRES_DB:-notifications}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - notifications

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notifications_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "notifications"
      RABBITMQ_DEFAULT_PASS: "notifications"
      RABBITMQ_DEFAULT_VHOST: "/notifications"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - notifications

  publisher:
    build:
      context: ../publisher
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PG_DSN: postgresql+asyncpg://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}
      RABBITMQ_URL: amqp://notifications:notifications@rabbitmq:5672/%2Fnotifications
      BATCH_SIZE: "100"
      POLL_INTERVAL_SEC: "1.0"
      LOCK_TTL_SEC: "60"
      MAX_ATTEMPTS: "10"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - notifications
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  notifications:
    driver: bridge
