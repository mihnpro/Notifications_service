services:
  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: notifications_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-notifications} -d ${POSTGRES_DB:-notifications}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - notifications

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notifications_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "notifications"
      RABBITMQ_DEFAULT_PASS: "notifications"
      RABBITMQ_DEFAULT_VHOST: "/notifications"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - notifications

  # ── API ───────────────────────────────────────────────────────────────────────

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-insecure-jwt-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/healthz'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - notifications

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - notifications

  api_gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    profiles: ["api-gateway"]
    ports:
      - "${API_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - notifications

  # ── Publisher (outbox relay) ───────────────────────────────────────────────────

  publisher:
    build:
      context: ../publisher
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PG_DSN: postgresql+asyncpg://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}
      RABBITMQ_URL: amqp://notifications:notifications@rabbitmq:5672/%2Fnotifications
      BATCH_SIZE: "100"
      POLL_INTERVAL_SEC: "1.0"
      LOCK_TTL_SEC: "60"
      MAX_ATTEMPTS: "10"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - notifications

  # ── Fanout worker ─────────────────────────────────────────────────────────────

  funout:
    build:
      context: ../funout
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://notifications:notifications@rabbitmq:5672
      RABBITMQ_VHOST: /notifications
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      REGION: default
      FANOUT_BATCH_SIZE: "1000"
      FANOUT_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - notifications

  # ── Delivery worker ───────────────────────────────────────────────────────────

  delivery:
    build:
      context: ../delivery
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://notifications:notifications@rabbitmq:5672
      RABBITMQ_VHOST: /notifications
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifications}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      REGION: default
      QUEUE_GROUPS: email,sms
      DELIVERY_CONCURRENCY: "16"
      PROVIDER_URL: http://provider_mock:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      provider_mock:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - notifications

  # ── Recovery service ─────────────────────────────────────────────────────────

  # recovery:
  #   build:
  #     context: ../recover
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   command: ["serve"]
  #   environment:
  #     RECOVER_CONFIG: /app/config/default.toml
  #     APP__INSTANCE_ID: "${RECOVERY_INSTANCE_ID:-recover-default}"
  #     APP__SERVER__BIND: "0.0.0.0:8080"
  #     APP__DB__URL: "postgres://${POSTGRES_USER:-notifications}:${POSTGRES_PASSWORD:-notifications}@postgres:5432/${POSTGRES_DB:-notifications}"
  #     APP__RMQ__URL: "amqp://notifications:notifications@rabbitmq:5672/%2Fnotifications"
  #     APP__RMQ__ENABLED: "false"
  #     APP__TELEMETRY__LOG_LEVEL: "info,sqlx=warn,lapin=warn"
  #     APP__TELEMETRY__LOG_FORMAT: "json"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   ports:
  #     - "${RECOVERY_PORT:-8081}:8080"
  #   networks:
  #     - notifications

  # ── Provider mock ─────────────────────────────────────────────────────────────

  provider_mock:
    build:
      context: ../provider_mock
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8000"
      SUCCESS_RATE: "${PROVIDER_SUCCESS_RATE:-0.7}"
      MIN_DELAY: "${PROVIDER_MIN_DELAY:-0.05}"
      MAX_DELAY: "${PROVIDER_MAX_DELAY:-0.5}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notifications

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  notifications:
    driver: bridge
