global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: notifications-local

scrape_configs:
  # ── API (Python / Litestar) ─────────────────────────────────────────────────
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # ── Publisher (Python / outbox relay) ───────────────────────────────────────
  - job_name: publisher
    static_configs:
      - targets: ["publisher:9091"]

  # ── Fanout worker (Go) ───────────────────────────────────────────────────────
  - job_name: funout
    static_configs:
      - targets: ["funout:9092"]

  # ── Delivery worker (Go) ─────────────────────────────────────────────────────
  - job_name: delivery
    static_configs:
      - targets: ["delivery:9093"]

  # ── Provider mock (Python / FastAPI) ─────────────────────────────────────────
  - job_name: provider_mock
    static_configs:
      - targets: ["provider_mock:8000"]

  # ── Recovery service (Rust / Axum) ───────────────────────────────────────────
  - job_name: recover
    static_configs:
      - targets: ["recover:8080"]

  # ── PostgreSQL (via postgres_exporter) ────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # ── RabbitMQ (built-in prometheus plugin, port 15692) ─────────────────────────
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics

  # ── Prometheus self-scrape ────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
