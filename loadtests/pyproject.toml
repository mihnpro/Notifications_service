[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notifications-loadtests"
version = "0.1.0"
description = "Load + chaos tests for the notifications platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "asyncpg>=0.29,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pydantic>=2.7,<3.0",
    "tabulate>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["loadtests_lib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-s -v"
log_cli = true
log_cli_level = "INFO"
markers = [
    "load: 50k golden path",
    "chaos_delivery: kills delivery mid-run",
    "chaos_rabbitmq: kills rabbitmq mid-run",
]
