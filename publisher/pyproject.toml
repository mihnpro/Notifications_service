[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notifications-publisher"
version = "0.1.0"
description = "Outbox relay: pulls pending outbox_events and publishes to RabbitMQ"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4,<10.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.1,<25.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.15.13",
    "mypy>=1.19.1",
]

[project.scripts]
publisher = "publisher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/publisher"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
