[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notifications-recover"
version = "0.1.0"
description = "Notifications recovery service: lease/outbox/retry/finalizer/DLQ jobs + admin API"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4,<10.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.1,<25.0",
    "prometheus-client>=0.20,<1.0",
    "litestar>=2.10,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "testcontainers[postgres]>=4.7,<5.0",
    "ruff>=0.15.13",
    "mypy>=1.19.1",
]

[project.scripts]
recover = "recover.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recover"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
